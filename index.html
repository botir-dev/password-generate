<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
    <title>Password generator</title>
  </head>
  <body>
    <!-- Container form -->
    <div>
      <div>
        <form>
          <span id="passwordSpan">Password</span>
          <button type="button" id="btn">Copy</button>
        </form>
      </div>

      <div>
        <div>
          <span>Character length</span>
          <span id="characterLength">4</span>
        </div>
        <form id="form">
          <input type="range" value="4" min="4" max="20" id="range" /> <br />

          <input type="checkbox" id="UpperCase" name="upperCase" />
          <span>UpperCase</span> <br />
          <input type="checkbox" id="LowerCase" name="lowerCase" />
          <span>LowerCase</span> <br />
          <input type="checkbox" id="Numbers" name="numbers" />
          <span>Numbers</span> <br />
          <input type="checkbox" id="Symbols" name="symbols" />
          <span>Symbols</span> <br />

          <button id="generate">Generate</button>
        </form>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
